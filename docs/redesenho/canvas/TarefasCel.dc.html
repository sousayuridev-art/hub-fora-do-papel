<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tarefas no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1400px; overflow: hidden; background: #F5F5F2; font-family: Poppins, system-ui, sans-serif; color: #0E1013; display: flex; flex-direction: column">
  <div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E4E4DE">
    <button type="button" aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">Fora do Papel</span>
    <button type="button" aria-label="Nova tarefa" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFB020; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #1B2B5C">Tarefas</h1>
    <span style="font-size: 14px; color: #5B5F66">4 atrasadas · 3 para hoje</span>
  </div>

  <div style="display: flex; gap: 20px; margin: 16px 16px 0; border-bottom: 1px solid #E4E4DE; font-size: 14.5px">
    <span style="padding-bottom: 10px; border-bottom: 2px solid #0E1013; font-weight: 600">Todas</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Clientes</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Internas</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Hub</span>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px 0; overflow: hidden">
    <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #F3D3CF; background: #FDE8E6; color: #9A1C12; font: 600 13.5px Poppins, sans-serif">Atrasadas 4</button>
    <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DADAD3; background: #FFFFFF; font: 13.5px Poppins, sans-serif">Hoje 3</button>
    <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DADAD3; background: #FFFFFF; font: 13.5px Poppins, sans-serif; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filtros</button>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
      <span style="font-size: 12.5px; font-weight: 600; color: {{g.cor}}; padding: 8px 2px 0">{{g.titulo}}</span>
      <sc-for list="{{g.itens}}" as="t" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid {{g.borda}}; border-radius: 14px; padding: 6px 14px 6px 4px; display: flex; align-items: center; gap: 4px">
          <button type="button" aria-label="Concluir tarefa" style="flex: 0 0 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #B9B9B2; box-sizing: border-box"></span></button>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px 0">
            <b style="font-size: 15px; font-weight: 600; line-height: 1.3">{{t.titulo}}</b>
            <span style="font-size: 12.5px; color: #5B5F66">{{t.origem}}</span>
            <span style="display: flex; gap: 8px; font-size: 12.5px"><span style="color: {{t.pcor}}">{{t.prazo}}</span><span style="color: #1E3FA8">{{t.situacao}}</span><b style="color: #9A1C12; font-weight: 600">{{t.prioridade}}</b></span>
          </span>
        </div>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const T = (titulo, origem, prazo, pcor, situacao, prioridade) => ({ titulo, origem, prazo, pcor, situacao, prioridade });
    return { grupos: [
      { titulo: 'Atrasadas · 4', cor: '#9A1C12', borda: '#F3D3CF', itens: [
        T('Ajustar relatório de giro por loja', 'Rede Patas › Sistema', 'venceu 20/10', '#9A1C12', 'Fazendo', 'Alta'),
        T('Revisar textos da página de serviços', 'Clínica Bem Cuidar › Agendamento', 'venceu 21/10', '#9A1C12', '', ''),
        T('Emitir nota da 2ª parcela', 'Interna · Financeiro', 'venceu 21/10', '#9A1C12', '', 'Alta'),
        T('Testar envio de pedidos no WhatsApp', 'Lavanderia Fácil › Automação', 'venceu 19/10', '#9A1C12', '', '')
      ]},
      { titulo: 'Hoje · 3', cor: '#7A4200', borda: '#E4E4DE', itens: [
        T('Montar vitrine da página inicial', 'Casa Aurora › Loja virtual', 'hoje', '#7A4200', 'Fazendo', ''),
        T('Preparar proposta da Ótica Nova', 'Interna · Vendas', 'hoje', '#7A4200', '', ''),
        T('Central de Tarefas: aprovar o visual', 'Hub · card TA-0', 'hoje', '#7A4200', '', '')
      ]},
      { titulo: 'Esta semana · 5', cor: '#2A2D33', borda: '#E4E4DE', itens: [
        T('Importar cadastro de fornecedores', 'Rede Patas › Sistema', 'sex 24/10', '#2A2D33', '', ''),
        T('Configurar frete por região', 'Casa Aurora › Loja virtual', 'sáb 25/10', '#2A2D33', '', 'Alta')
      ]}
    ] };
  }
}
</script>
</body>
</html>
