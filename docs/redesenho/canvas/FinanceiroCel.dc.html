<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Financeiro no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1400px; overflow: hidden; background: #F5F5F2; font-family: Poppins, system-ui, sans-serif; color: #0E1013; display: flex; flex-direction: column">
  <div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E4E4DE">
    <button type="button" aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">Fora do Papel</span>
    <button type="button" aria-label="Nova cobrança" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFB020; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12.5px; color: #5B5F66">Gestão</span>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #1B2B5C">Financeiro</h1>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 16px 4px; overflow: hidden">
    <span style="flex: 0 0 140px; padding: 12px 14px; border-radius: 14px; background: #FDE8E6; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; color: #9A1C12">Em atraso</span><b style="font-size: 20px; font-weight: 600; color: #9A1C12">R$ 3.580</b></span>
    <span style="flex: 0 0 150px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; color: #5B5F66">Receber em 30 dias</span><b style="font-size: 20px; font-weight: 600">R$ 12.340</b></span>
    <span style="flex: 0 0 140px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12.5px; color: #5B5F66">Resultado</span><b style="font-size: 20px; font-weight: 600; color: #145A37">+ R$ 6.420</b></span>
  </div>

  <div style="display: flex; gap: 20px; margin: 14px 16px 0; border-bottom: 1px solid #E4E4DE; font-size: 14.5px">
    <span style="padding-bottom: 10px; border-bottom: 2px solid #0E1013; font-weight: 600">Cobranças</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Mensalidades</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Despesas</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Fluxo</span>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
      <span style="font-size: 12.5px; font-weight: 600; color: {{g.cor}}; padding: 8px 2px 0">{{g.titulo}}</span>
      <sc-for list="{{g.itens}}" as="c" hint-placeholder-count="2">
        <div style="background: #FFFFFF; border: 1px solid #E4E4DE; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 15px; font-weight: 600">{{c.cliente}}</b><b style="font-size: 14.5px; font-weight: 600">{{c.valor}}</b></span>
            <span style="font-size: 13px; color: #2A2D33">{{c.descricao}}</span>
            <span style="font-size: 12.5px; color: {{c.vCor}}">{{c.vence}}</span>
          </span>
          <button type="button" style="flex: 0 0 auto; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #DADAD3; background: #FFFFFF; font: 500 13.5px Poppins, sans-serif">Recebi</button>
        </div>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const C = (cliente, descricao, vence, vCor, valor) => ({ cliente, descricao, vence, vCor, valor });
    return { grupos: [
      { titulo: 'Atrasadas · 2', cor: '#9A1C12', itens: [
        C('Ótica Nova', 'Diagnóstico', 'venceu 12/10', '#9A1C12', 'R$ 1.200'),
        C('Lavanderia Fácil', '2ª parcela de 3', 'venceu 18/10', '#9A1C12', 'R$ 2.380')
      ]},
      { titulo: 'Esta semana · 3', cor: '#7A4200', itens: [
        C('Clínica Bem Cuidar', '2ª parcela de 3', 'vence sex 24/10', '#7A4200', 'R$ 3.180'),
        C('Studio Leve', 'Mensalidade de outubro', 'vence sáb 25/10', '#7A4200', 'R$ 1.200'),
        C('Mercado do Sítio', 'Mensalidade de outubro', 'vence sáb 25/10', '#7A4200', 'R$ 400')
      ]},
      { titulo: 'Próximos 30 dias · 3', cor: '#4A4D54', itens: [
        C('Casa Aurora', '2ª parcela de 3', 'vence 05/11', '#4A4D54', 'R$ 2.040'),
        C('Rede Patas', 'Mensalidade de novembro', 'vence 05/11', '#4A4D54', 'R$ 400')
      ]}
    ] };
  }
}
</script>
</body>
</html>
