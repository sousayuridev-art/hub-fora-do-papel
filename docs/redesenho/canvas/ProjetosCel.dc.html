<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Projetos no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Bricolage+Grotesque:wght@800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1400px; overflow: hidden; background: #F5F5F2; font-family: Poppins, system-ui, sans-serif; color: #0E1013; display: flex; flex-direction: column">
  <div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E4E4DE">
    <button type="button" aria-label="Abrir menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">Fora do Papel</span>
    <span style="width: 44px"></span>
  </div>

  <div style="padding: 20px 16px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; color: #5B5F66">Entregar</span><h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #1B2B5C">Projetos</h1></div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #FFB020; font: 600 14.5px Poppins, sans-serif">Lançar horas</button>
  </div>

  <div style="margin: 16px 16px 0; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E4DE; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13.5px"><span style="color: #5B5F66">Horas desta semana</span><b style="font-weight: 600">12h30 de 30h</b></div>
    <span style="height: 6px; border-radius: 3px; background: #EDEDE7; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 42%; border-radius: 3px; background: #0E1013"></span></span>
  </div>

  <div style="display: flex; gap: 22px; margin: 18px 16px 0; border-bottom: 1px solid #E4E4DE; font-size: 14.5px">
    <span style="padding-bottom: 10px; border-bottom: 2px solid #0E1013; font-weight: 600">Andamento 5</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Mensalidade 3</span>
    <span style="padding-bottom: 10px; color: #4A4D54">Concluídos</span>
  </div>

  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12.5px; font-weight: 600; color: #9A1C12; padding: 2px 2px">Pede atenção · 2</span>
    <sc-for list="{{atencao}}" as="p" hint-placeholder-count="2">
      <div style="background: #FFFFFF; border: 1px solid #F3D3CF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 15px; font-weight: 600">{{p.projeto}}</b><span style="font-size: 13px; color: #5B5F66">{{p.lancamento}}</span></div>
        <span style="font-size: 14px">{{p.agora}}</span>
        <span style="font-size: 13px; color: #9A1C12">{{p.motivo}}</span>
        <span style="font-size: 12.5px; color: #5B5F66">{{p.cliente}} · {{p.horas}}</span>
      </div>
    </sc-for>
    <span style="font-size: 12.5px; font-weight: 600; color: #145A37; padding: 8px 2px 2px">No ritmo · 3</span>
    <sc-for list="{{ritmo}}" as="p" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #E4E4DE; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; gap: 8px"><b style="font-size: 15px; font-weight: 600">{{p.projeto}}</b><span style="font-size: 13px; color: #5B5F66">{{p.lancamento}}</span></div>
        <span style="font-size: 14px">{{p.agora}}</span>
        <span style="font-size: 12.5px; color: #5B5F66">{{p.cliente}} · {{p.horas}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const P = (projeto, cliente, agora, motivo, lancamento, horas) => ({ projeto, cliente, agora, motivo, lancamento, horas });
    return {
      atencao: [
        P('Sistema de agendamento', 'Clínica Bem Cuidar', 'Fase 2 · Site e WhatsApp', 'Aprovação parada há 5 dias', 'no ar 11/11', '58h de 60h'),
        P('Sistema Rede Patas', 'Rede Patas', 'Módulo Estoque · 2ª rodada', 'Ajuste pedido de novo', 'no ar 10/12', '50h de 120h')
      ],
      ritmo: [
        P('Loja virtual', 'Casa Aurora', 'Fase 1 · Desenho da loja', '', 'no ar 05/12', '12h de 80h'),
        P('Automação de pedidos', 'Lavanderia Fácil', 'Fase 3 · Testes', '', 'no ar 31/10', '20h de 24h'),
        P('Site institucional', 'Mercado do Sítio', 'Fase 2 · Conteúdo', '', 'no ar 14/11', '9h de 30h')
      ]
    };
  }
}
</script>
</body>
</html>
