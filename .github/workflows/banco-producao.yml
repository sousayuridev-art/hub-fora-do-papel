# Aplica as migrações de supabase/migrations no banco de PRODUÇÃO.
# Roda só quando alguém clica em "Run workflow" no GitHub (aba Actions).
# Senhas ficam nos "secrets" do repositório: nunca no código nem no chat.
name: Banco de produção · migrações

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar = só mostra o que mudaria · aplicar = grava no banco de produção"
        type: choice
        options: [verificar, aplicar]
        default: verificar

concurrency:
  group: banco-producao
  cancel-in-progress: false

jobs:
  migracoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: cjzzbpqwlpjvlawllfqy
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se os segredos foram cadastrados
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Falta o secret SUPABASE_DB_PASSWORD"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ligar ao projeto de produção
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrações (coluna Local = repositório, Remote = produção)
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      # Card RE-0: confere só os NOMES dos segredos das funções; o valor nunca é lido nem impresso.
      - name: Segredos das funções (só os nomes)
        if: inputs.modo == 'verificar'
        run: |
          nomes=$(supabase secrets list --project-ref "$PROJECT_REF" -o json | jq -r '.[].name')
          for s in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ANTHROPIC_API_KEY_HUB IA_TETO_MENSAL_CENTAVOS; do
            if grep -qx "$s" <<< "$nomes"; then echo "ok: $s"; else echo "falta: $s"; fi
          done

      - name: Simular (nada é gravado)
        if: inputs.modo == 'verificar'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar no banco de produção
        if: inputs.modo == 'aplicar'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      # Card RE-1: função do Google Meet. Sem verificação de JWT porque o Google chama /retorno;
      # as rotas do dono conferem o login dentro da função.
      # A chave atual do Supabase não tem permissão de publicar funções (21/10): a função foi
      # publicada pelo painel. Com uma chave com "edge_functions_write", este passo volta a valer.
      - name: Publicar funções de servidor
        if: inputs.modo == 'aplicar'
        continue-on-error: true
        run: supabase functions deploy reunioes-google --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      # Card MK-3: sugestões da IA na Central de conteúdo (segredo ANTHROPIC_API_KEY_HUB).
      # Passo separado: a falha da função de reuniões não impede esta. Mesma limitação da chave acima.
      - name: Publicar função da IA da Central
        if: inputs.modo == 'aplicar'
        continue-on-error: true
        run: supabase functions deploy marketing-ia --project-ref "$PROJECT_REF" --use-api

      - name: Situação depois de aplicar
        if: inputs.modo == 'aplicar'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
